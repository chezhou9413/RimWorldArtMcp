interface:
  display_name: "RimWorld 贴图参考与生图"
  short_description: "检索原版和二次元种族参考，准备生图、透明描边与持续录入图库"
  default_prompt: "使用 $rimworld-texture-art 为我的 RimWorld 贴图找到合适参考，再准备生图和最终输出。"
dependencies:
  tools:
    - type: "mcp"
      value: "rimworldArt"
      description: "本地 RimWorld 参考图库、描边处理与持续录入工具"
      transport: "stdio"
policy:
  allow_implicit_invocation: true
